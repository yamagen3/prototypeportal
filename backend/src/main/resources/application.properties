# Application Configuration
app.name=Prototype Portal API
app.version=1.0.0

# JWT Configuration
jwt.secret=CHANGE_THIS_TO_A_SECURE_SECRET_KEY_IN_PRODUCTION
jwt.expiration.access=3600000
jwt.expiration.refresh=604800000

# Database Configuration (for reference - actual config in persistence.xml)
db.host=localhost
db.port=5432
db.name=prototypeportal
db.username=postgres
db.password=postgres

# External System Integration
external.approval.webhook.url=http://external-approval-system/webhook
external.approval.poll.interval=300000

# Logging
logging.level=INFO
